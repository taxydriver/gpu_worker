# FilmForge AUDIO worker as a SkyPilot task — RunPod cloud.
#
# The sound stage: Stable Audio 3 (music) + Chatterbox (cloned-voice EN dialogue)
# + Indic Parler (Telugu/Tamil described-voice dialogue) on one 24GB box.
# No ComfyUI: COMFY_START_CMD stays unset so the worker's comfy watchdog disables
# itself; audio jobs run in their own provisioned venvs (sa3_spike / tts_spike /
# parler_spike — see provision_sa3.sh / provision_tts.sh).
#
# BAREBOX image strategy (learned 2026-07-17, first launch): the prebuilt
# runpod/comfyui image lacks rsync → SkyPilot runtime setup dies (rc=127). Like
# ff_worker_render_runpod_barebox.yaml, we use NO image_id — SkyPilot's clean
# runpod/base ubuntu — and let each provisioner venv pip-install its own torch
# (their packages declare it; --system-site-packages finds nothing on barebox).
# Weights land in /workspace (HF_HOME override) per the root-fs-full lesson in
# backend/docs/discoveries/oss-dialogue-tts-validation-2026-07-15.md §6d.
#
# PREREQS (once):
#   - gpu_worker main pushed to GitHub (deploy = git clone/pull, NOT local rsync)
#   - HF token whose account accepted the gated repos: stabilityai stable-audio-3
#     license + ai4bharat/indic-parler-tts terms
#
# Launch:
#   sky launch -c ff-audio ff_worker_audio_runpod.yaml -y -d \
#     --env FILMFORGE_BACKEND_URL=… \
#     --secret WORKER_REGISTRATION_TOKEN=… \
#     --secret HF_TOKEN=…
# Idle shutdown:  sky autostop ff-audio -i 30 --down
# Teardown:       sky down -y ff-audio

resources:
  # US-pinned: identical $0.27 across 25 US zones, and this box serves Maya's
  # interactive voice — an unpinned optimizer picked AU (2026-07-26 dryrun),
  # adding round-trip latency for nothing.
  infra: runpod/US
  # 24GB is enough: SA3 ~15GB loads per job; the two dialogue models (~8GB) can
  # stay resident. Cheapest-first (RunPod catalog $/hr, 2026-07-26): A5000 24GB
  # $0.27, L4 24GB $0.39, A40 48GB $0.44 as the availability fallback. The old
  # list (RTX4090 $0.69 / L40S $0.99 / A100-80GB $1.39) never had the Vast twin's
  # cost guardrail back-ported — A100-80GB on an audio box is 5x overpay.
  accelerators: {RTXA5000:1, L4:1, A40:1}
  # Hard ceiling. Unlike Vast, RunPod's catalog prices are real (fixed, published,
  # no per-host mislabeling), so this filter actually binds — see discovery
  # vast-skypilot-cheap-selection-unreliable-2026-07-25.md for why it does not on Vast.
  max_hourly_cost: 0.50
  use_spot: false   # audio jobs are short; flip to spot later if cost demands
  ports: 9000
  disk_size: 150    # ~30GB audio weights + HF cache + per-venv torch + headroom
  # NO image_id — barebox (see header)

envs:
  REGISTER_WITH_BACKEND: "true"
  WORKER_HEARTBEAT_SECONDS: "60"
  # The job-acceptance gate: this worker takes audio work only.
  WORKER_CAPABILITIES: "tts_dialogue,stable_audio3"
  HF_HOME: /workspace/hf_cache
  # Injected at launch: FILMFORGE_BACKEND_URL, WORKER_REGISTRATION_TOKEN, HF_TOKEN

setup: |
  set -euo pipefail
  export HF_HOME=/workspace/hf_cache
  # Base image sets HF_HUB_ENABLE_HF_TRANSFER=1 but our provisioner venvs don't
  # install hf_transfer → downloads hard-fail. Plain downloads are fine here.
  export HF_HUB_ENABLE_HF_TRANSFER=0
  mkdir -p "$HF_HOME"

  # cloudflared so the broker can probe /health over a public URL.
  # Download to a temp path, then `install` it — never `curl -o` straight to the
  # destination. Observed 2026-07-26: curl hit an SSL eof AFTER writing all 32MB,
  # so it returned 56, the `&& chmod +x` was skipped, and `set -e` did NOT fire
  # (bash exempts a non-final command in an && list). Result: a complete-looking
  # but NON-EXECUTABLE cloudflared, setup "succeeding", and the run block dying on
  # permission-denied with no tunnel — a box that can never be probed or used.
  if ! command -v cloudflared >/dev/null 2>&1; then
    curl -fsSL --retry 3 --retry-delay 2 \
      https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
      -o /tmp/cloudflared.dl
    install -m 0755 /tmp/cloudflared.dl /usr/local/bin/cloudflared
    rm -f /tmp/cloudflared.dl
  fi

  # Worker code from GitHub (same repo/idiom as the render variant).
  if [ -d /workspace/gpu_worker/.git ]; then
    git -C /workspace/gpu_worker pull --ff-only
  else
    git clone https://github.com/taxydriver/gpu_worker.git /workspace/gpu_worker
  fi
  cd /workspace/gpu_worker
  python3 -m venv .venv
  .venv/bin/pip install -r requirements.txt

  # Provision the three audio stacks (idempotent; each makes its own venv).
  # HF_TOKEN is needed for the gated repos (SA3 license, Indic Parler terms).
  WORKSPACE=/workspace bash provision_tts.sh
  WORKSPACE=/workspace bash provision_sa3.sh

run: |
  set -euo pipefail
  WORKER_PORT=9000
  export HF_HOME=/workspace/hf_cache
  export PARLER_PORT=9101

  # Resident Parler voice server — the worker's /tts + tts_dialogue handler
  # PROXY to :9101; without it, voice requests 502 (gap found during the
  # 2026-07-24 Vast E2E; on Verda systemd owns this, on SkyPilot the run
  # block must).
  pkill -f parler_server 2>/dev/null || true
  nohup /workspace/parler_spike/bin/python /workspace/gpu_worker/parler_server.py \
    >/tmp/parler.log 2>&1 &

  # cloudflared tunnel so the broker reaches /health. Full path: /usr/local/bin
  # is not always on PATH in the run env.
  pkill -f "cloudflared tunnel --url http://127.0.0.1:$WORKER_PORT" || true
  : >/tmp/ff_tunnel.log
  nohup /usr/local/bin/cloudflared tunnel --url "http://127.0.0.1:$WORKER_PORT" --no-autoupdate >/tmp/ff_tunnel.log 2>&1 </dev/null &
  WORKER_URL=""
  for _ in $(seq 1 30); do
    WORKER_URL="$(grep -aEo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/ff_tunnel.log | tail -n1 || true)"
    [ -n "$WORKER_URL" ] && break; sleep 2
  done
  [ -z "$WORKER_URL" ] && { echo "ERROR: no tunnel URL"; exit 1; }
  echo "Tunnel: $WORKER_URL"

  # No COMFY_START_CMD / COMFY_BASE_URL: audio-only box, comfy watchdog disabled.
  export SA3_VENV=/workspace/sa3_spike
  export WORKER_PUBLIC_URL="$WORKER_URL"
  export WORKER_NAME="sky-audio-$(hostname)"

  # Start the worker (self-registers with the backend, advertises audio caps).
  cd /workspace
  /workspace/gpu_worker/.venv/bin/python -m uvicorn gpu_worker.app:app --host 0.0.0.0 --port "$WORKER_PORT"
